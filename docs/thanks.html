<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you – Tab Nap</title>
<style>
:root{color-scheme:light dark;--bg:#F5F3FF;--surface:#FFFFFF;--line:#DDD8F5;--fg:#1E1B4B;--muted:#55527D;--accent:#312E81;--accent-soft:#E4E1FB;--second:#7A5C00;--second-soft:#FDF1BE;--btn-text:#fff;--shadow:0 1px 2px rgba(49,46,129,.06),0 8px 30px rgba(49,46,129,.09)}
@media(prefers-color-scheme:dark){:root{--bg:#14123A;--surface:#1C1A4A;--line:#33307A;--fg:#EEEDFF;--muted:#B0AEDB;--accent:#A5B4FC;--accent-soft:#272566;--second:#FDE68A;--second-soft:#3A3358;--btn-text:#1E1B4B;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.3)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mark{filter:drop-shadow(0 3px 6px rgba(49,46,129,.3))}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:17px}
.card{background:radial-gradient(120% 100% at 50% 0%,var(--accent-soft),var(--surface) 65%);border:1px solid var(--line);max-width:460px;margin:16px;padding:36px 32px;border-radius:24px;text-align:center;box-shadow:var(--shadow)}
.heart{font-size:44px;color:var(--accent);line-height:1;margin-top:14px}
h1{margin:10px 0 12px;font-size:28px;letter-spacing:-.01em}p{color:var(--muted);margin:8px 0}
.by{font-size:13px;margin-top:20px}
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 32 32" width="56" height="56" aria-hidden="true"><defs><linearGradient id="mk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#423E8C"/><stop offset="1" stop-color="#262368"/></linearGradient></defs><rect width="32" height="32" rx="7" fill="url(#mk)"/><rect x="4.8" y="17.6" width="22.4" height="9.6" rx="2.2" fill="#BEC8FF"/><rect x="4.8" y="14.7" width="10.2" height="5" rx="1.9" fill="#BEC8FF"/><path d="M19.8 4.9a6.6 6.6 0 1 0 5 10.6 5.6 5.6 0 0 1-5-10.6z" fill="#FDE68A"/></svg>
    <div class="heart" aria-hidden="true">❤</div>
    <h1>Thank you!</h1>
    <p>Your support keeps Tab Nap free, ad-free and tracking-free.</p>
    <p>If the extension is installed, it will now show a small "Supporter ❤" badge in the popup and stop asking.</p>
    <p>Go and enjoy a lighter browser.</p>
    <p class="by">by Quantumbyte Labs</p>
  </main>
</body>
</html>
